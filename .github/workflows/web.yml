name: Build

# Builds the browser version and publishes it to GitHub Pages, and builds the
# desktop versions and attaches them to the run.
#
# Multiplayer is desktop-only -- browsers cannot open raw UDP sockets, and the
# WebSocket alternative cannot be made to work from an HTTPS page to a LAN
# address. So the Pages link is the try-it-instantly build, and playing with
# someone else means downloading a desktop build from the run's artifacts.
# See docs/networking-decision.md.
#
# Requires Settings -> Pages -> Build and deployment -> Source: "GitHub Actions",
# which is already set and is the one thing a workflow cannot set for itself.
# If deploy ever starts failing with a Pages error, check that first.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so a finished build is
# not thrown away by a newer push that may still fail.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.4.1"

jobs:
  build:
    name: Test and export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The editor is ~120 MB and the export templates ~1.2 GB. Downloading
      # them on every push would dominate the run time.
      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable-v1

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip "${BASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-unzip
          mv "/tmp/godot-unzip/Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
          curl -fsSL -o /tmp/templates.tpz "${BASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpz
          mkdir -p ~/.local/share/godot/export_templates
          mv /tmp/tpz/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Import project
        # A fresh checkout has no .godot/, so the global class_name registry
        # does not exist yet and every script using class_name fails to
        # resolve. This step builds it and must run before anything loads a
        # scene. It reports errors through its exit code unreliably, hence the
        # explicit check that the cache actually appeared.
        run: |
          set -euo pipefail
          godot --headless --import
          test -f .godot/global_script_class_cache.cfg

      - name: Movement smoke test
        # Gates the deploy. 22 behavioural checks; exits non-zero on failure.
        run: godot --headless --script scripts/tests/movement_smoke_test.gd

      - name: Combat smoke test
        # 50 checks: fire rate, damage, falloff, headshot reward, TTK, reload,
        # and that spread is reproducible from the command tick.
        run: godot --headless --script scripts/tests/combat_smoke_test.gd

      - name: Bot smoke test
        # 82 checks. Mostly fairness claims rather than behaviour: that a bot
        # cannot see through a wall or behind itself, cannot shoot faster than
        # the weapon allows, spends its reaction time before firing, and
        # forgets a target it has lost. Those are exactly the bugs that are
        # invisible by feel, because losing to them feels like losing. Also
        # that the duel wing stays isolated: one bot per room, no bot leaves,
        # and fighting one does not pull the others in.
        run: godot --headless --script scripts/tests/bot_smoke_test.gd

      - name: Net smoke test
        # 51 checks. The join code is arithmetic and is checked across the whole
        # 192.168.x space, because a code that decodes to a plausible but wrong
        # address looks like a network fault and sends someone into their
        # router settings. The handshake half runs a real ENet host and client
        # over loopback in one process.
        run: godot --headless --script scripts/tests/net_smoke_test.gd

      - name: Export web build
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          # The no-threads template must be the one that got used: GitHub Pages
          # cannot send the COOP/COEP headers that a threaded build needs, and
          # a threaded build fails at runtime rather than at export.
          if [ -f build/web/index.worker.js ]; then
            echo "::error::Threaded web build detected. Set variant/thread_support=false in export_presets.cfg."
            exit 1
          fi

      - name: Export desktop builds
        run: |
          set -euo pipefail
          mkdir -p build/mac build/windows build/linux
          godot --headless --export-release "macOS"
          godot --headless --export-release "Windows"
          godot --headless --export-release "Linux"
          test -s build/mac/BestFPS.zip
          test -s build/windows/BestFPS.exe
          test -s build/linux/BestFPS.x86_64
          # The Mac build has to be universal, or an Apple Silicon machine
          # either refuses it or quietly drags in Rosetta.
          unzip -p build/mac/BestFPS.zip "BestFPS.app/Contents/MacOS/BestFPS" > /tmp/macbin
          file /tmp/macbin | grep -q "universal binary" \
            || { echo "::error::macOS build is not a universal binary."; exit 1; }

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: BestFPS-macOS
          path: build/mac/BestFPS.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: BestFPS-Windows
          path: build/windows/BestFPS.exe

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: BestFPS-Linux
          path: build/linux/BestFPS.x86_64

      - name: Disable Jekyll
        # Pages artifacts are served as-is, but this costs nothing and stops a
        # future switch to branch-based Pages from eating files.
        run: touch build/web/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to Pages
    needs: build
    # Only the default branch publishes. Other branches still get built and
    # smoke-tested above, which is the part that catches breakage.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
